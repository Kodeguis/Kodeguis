<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a20"/>
      <stop offset="100%" stop-color="#070709"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="black"/>
      <circle cx="512" cy="512" r="344" fill="white"/>
      <circle cx="570" cy="506" r="320" fill="black"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="344" fill="#f6f6f2" opacity="0.9" filter="url(#glow)" mask="url(#crescent)"/>
  <circle cx="512" cy="512" r="344" fill="#f6f6f2" mask="url(#crescent)"/>
</svg>